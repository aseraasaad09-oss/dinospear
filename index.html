<style>
:root{--bg:#eef4ff;--bg2:#f8fbff;--card:#ffffff;--ink:#172449;--muted:#55628a;--line:#d5def3;--blue:#2f6fe4;--blue2:#1d4fb8;--gold:#ffc83d;--green:#2fa865;--red:#dc2626;--r:20px;--disp:"Lalezar","Cairo",system-ui,sans-serif;--body:"Cairo",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);background:linear-gradient(180deg,#dce9ff 0,var(--bg) 380px,var(--bg2) 100%);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--disp);font-size:26px;letter-spacing:1px;color:var(--blue2)}
.brand img{width:40px;height:40px}
nav.main{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{white-space:nowrap;text-decoration:none;font-weight:700;font-size:15px;padding:8px 12px;border-radius:12px;color:var(--muted)}
nav.main a:hover{background:#e8efff;color:var(--blue2)}
.acct{display:flex;align-items:center;gap:8px}
.acct .who{font-weight:800;font-size:14px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;background:var(--blue);color:#fff;transition:transform .1s,filter .15s;min-height:48px}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--blue2);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn.green{background:var(--green)}
.btn.sm{padding:8px 14px;font-size:14px;min-height:40px;border-radius:12px}
.btn svg{width:22px;height:22px;flex:none}
.lang{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 10px;font-weight:800;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--blue);color:#fff}
/* gate */
#gate{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 16px 60px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 60px rgba(30,60,140,.16);max-width:440px;width:100%;padding:26px 22px}
.gcard .logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
.gcard .logo img{width:76px;height:76px}
.gcard h1{font-family:var(--disp);font-size:38px;margin:0;color:var(--blue2);letter-spacing:1px;font-weight:400}
.gcard .sub{color:var(--muted);text-align:center;margin:0 0 16px;font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef3ff;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px;border-radius:11px;font-weight:800;font-size:15px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--blue2);box-shadow:0 2px 8px rgba(30,60,140,.12)}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;font:600 16px var(--body);background:#fbfcff;color:var(--ink)}
input:focus{outline:none;border-color:var(--blue)}
.rule{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.status{min-height:24px;font-weight:700;font-size:14px;margin:10px 0 0;text-align:center}
.status.err{color:var(--red)}.status.ok{color:var(--green)}
.gcard form .btn{width:100%;margin-top:14px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}
/* sections */
section{padding:56px 0}
.kicker{color:var(--blue);font-weight:800;font-size:14px;letter-spacing:.5px}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(32px,5vw,46px);margin:0 0 10px;line-height:1.2;color:var(--ink)}
.lead{color:var(--muted);font-size:17px;max-width:720px}
.hero{padding:28px 0 40px}
.hero .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:center}
.hero .pic{border-radius:28px;overflow:hidden;box-shadow:0 26px 60px rgba(30,60,140,.25);aspect-ratio:16/10;background:#cfe0ff}
.hero .pic img{width:100%;height:100%;object-fit:cover}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(44px,7vw,76px);line-height:1.05;margin:6px 0 8px;color:var(--blue2)}
.hero .by{font-weight:800;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pill{display:inline-block;background:#fff3cf;color:#7a5600;font-weight:800;border-radius:999px;padding:4px 12px;font-size:13px}
/* roadmap */
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.step b{font-family:var(--disp);font-weight:400;font-size:26px;color:var(--blue);min-width:34px}
.step span{flex:1;font-weight:700}
.step em{font-style:normal;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:#e6f6ec;color:#1d7a46;white-space:nowrap}
.step em.soon{background:#eef1f8;color:var(--muted)}.step em.vote{background:#fff3cf;color:#7a5600}
.bar{height:14px;background:#dfe7f8;border-radius:999px;overflow:hidden;margin-top:14px;max-width:520px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#46b4ff);width:56%}
/* features */
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:22px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(30,60,140,.08)}
.feat img{aspect-ratio:16/10;object-fit:cover;width:100%}
.feat div{padding:12px 16px 16px}.feat h3{margin:0 0 2px;font-size:19px}.feat p{margin:0;color:var(--muted);font-size:14.5px}
/* app frames */
.frame{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px rgba(30,60,140,.12);margin-top:18px}
.frame iframe{display:block;width:100%;border:0;height:900px}
.frame.mid iframe{height:760px}
.frame.town iframe{height:min(82vh,820px);min-height:520px}
/* cards row */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:21px}.card p{margin:0;color:var(--muted)}
.card .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.card .ic svg{width:30px;height:30px}
.watch{position:relative;border-radius:26px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;margin-top:10px}
.watch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.watch div{position:relative;padding:28px;color:#fff}.watch h2{color:#fff}
footer{padding:36px 0 60px;color:var(--muted);text-align:center;font-size:14px}
#installBtn[hidden]{display:none}
@media (max-width:860px){
 .hero .grid{grid-template-columns:1fr}
 .frame iframe{height:1150px}.frame.mid iframe{height:900px}
 header .wrap{flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
 nav.main{order:3;flex-basis:100%}
 .brand{font-size:22px}.brand img{width:34px;height:34px}
 .acct .who{display:none}
 section{padding:40px 0}
}
</style>
</head>
