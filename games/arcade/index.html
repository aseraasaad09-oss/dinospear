<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DINOSPEAR ARCADE — 10 games</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#4c1d95,#0b1020 60%);color:#fff;font-family:system-ui,Segoe UI,sans-serif;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1100px;margin:0 auto 10px}
a.back,.lang button{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:0;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer}
h1{text-align:center;font-size:clamp(30px,7vw,54px);margin:10px 0 4px;letter-spacing:1px;text-shadow:0 4px 0 #000}
.sub{text-align:center;opacity:.85;margin:0 0 20px}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.g{display:block;color:#fff;text-decoration:none;border-radius:20px;padding:16px;border:3px solid #0b0b12;box-shadow:0 6px 0 #0b0b12;transition:transform .12s;min-height:150px;position:relative;overflow:hidden}
.g:hover{transform:translateY(-3px)}.g:active{transform:translateY(2px);box-shadow:0 3px 0 #0b0b12}
.g i{font-style:normal;font-size:44px;display:block}.g b{display:block;font-size:20px;margin:6px 0 4px;text-shadow:0 2px 0 #0006}.g small{display:block;line-height:1.5;opacity:.95;font-weight:600}
.g .best{position:absolute;top:10px;inset-inline-end:12px;background:#0008;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
.g .tag{position:absolute;bottom:10px;inset-inline-end:12px;background:#fde047;color:#3a2a00;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:900}
</style>
</head>
<body>
<div class="top"><a class="back" href="../../index.html" id="home">← DINOSPEAR</a><div class="lang"><button type="button" id="lang"></button></div></div>
<h1>DINOSPEAR ARCADE</h1>
<p class="sub" id="sub"></p>
<div class="grid" id="grid"></div>
<script>
var lang = 'ar'; try { lang = localStorage.getItem('aser_lang') || 'ar'; } catch (e) {} if (lang !== 'en') lang = 'ar';
var T = function (en, ar) { return lang === 'en' ? en : ar; };
document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'عربي';
document.getElementById('lang').onclick = function () { try { localStorage.setItem('aser_lang', lang === 'ar' ? 'en' : 'ar'); } catch (e) {} location.reload(); };
document.getElementById('sub').textContent = T('10 new games · phone and computer · no internet needed after the first open', '10 ألعاب جديدة · موبايل وكمبيوتر · من غير نت بعد أول مرة');
var G = [
  ['slipper', '🩴', 'SLIPPER STORM', 'عاصفة الشباشب', 'Mum is throwing slippers! Jump, duck, grab the snacks.', 'ماما بترمي شباشب! نط، اوطى، ولمّ الأكل.', '#f59e0b'],
  ['falafel', '🥙', 'FALAFEL TOWER', 'برج الطعمية', 'Stack the biggest sandwich in Egypt.', 'اعمل أكبر سندوتش في مصر.', '#ea580c'],
  ['balloon', '🎈', 'BALLOON DINO', 'داينو البالونة', 'Hold to blow, let go to sink. Birds pop balloons!', 'اضغط تنفخ وسيب تنزل. العصافير بتفرقع البالونات!', '#0ea5e9'],
  ['goat', '🐐', 'GRAVITY GOAT', 'معزة الجاذبية', 'Run on the floor and the ceiling. Flip gravity!', 'اجري على الأرض والسقف. اقلب الجاذبية!', '#7c3aed'],
  ['postman', '📮', 'ROOFTOP POSTMAN', 'بوسطجي السطوح', 'Jet-pack deliveries. Land softly!', 'توصيل بالجت باك. انزل براحة!', '#0284c7'],
  ['spear', '🎯', 'SPEAR THROW', 'رمية الرمح', 'Aim, power, wind — pop the balloons.', 'نشّن، قوة، وهوا — فرقع البالونات.', '#16a34a'],
  ['darbuka', '🥁', 'DARBUKA BEAT', 'إيقاع الدربكة', 'Real Egyptian rhythms: DUM and TAK.', 'إيقاعات مصري بجد: دُم وتَك.', '#b45309'],
  ['tug', '🪢', 'TUG OF WAR', 'شد الحبل', 'Dino vs cat — timing beats mashing. 1 or 2 players.', 'الداينو ضد القطة — التوقيت أهم من الدوس. لاعب أو اتنين.', '#15803d'],
  ['hook', '🪝', 'GOLD HOOK', 'صنارة الدهب', 'Drop the swinging hook, pull up the gold.', 'نزّل الصنارة اللي بتتمرجح وطلّع الدهب.', '#ca8a04'],
  ['hop3d', '🏝️', 'SKY HOP 3D', 'نط الجزر 3D', 'Jump across floating islands in 3D.', 'نط بين جزر طايرة 3D.', '#0369a1', '3D']
];
var grid = document.getElementById('grid');
G.forEach(function (g) {
  var a = document.createElement('a'); a.className = 'g'; a.href = g[0] + '.html'; a.style.background = 'linear-gradient(160deg,' + g[6] + ',' + g[6] + 'aa)';
  var best = 0; try { best = JSON.parse(localStorage.getItem('arc_best_' + g[0]) || '0'); } catch (e) {}
  a.innerHTML = '<i>' + g[1] + '</i><b></b><small></small>' + (best ? '<span class="best">🏆 ' + best + '</span>' : '') + (g[7] ? '<span class="tag">' + g[7] + '</span>' : '');
  a.querySelector('b').textContent = T(g[2], g[3]); a.querySelector('small').textContent = T(g[4], g[5]);
  grid.appendChild(a);
});
</script>
</body>
</html>
