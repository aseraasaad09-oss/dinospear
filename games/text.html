<script>
(function () {
  'use strict';

  var lang = 'ar'; try { lang = localStorage.getItem('aser_lang') === 'en' ? 'en' : 'ar'; } catch (e) {}

    forest: /(غاب[ةه]|شجر|forest|tree|jungle)/i, space: /(فضاء|صاروخ|كوكب|مريخ|space|rocket|planet|mars)/i,

  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

    if (paras.length < 2) { var sent = story.split(/(?<=[.!?؟。])\s+/).map(function (s) { return s.trim(); }).filter(Boolean); var n = Math.min(6, Math.max(1, Math.ceil(sent.length / 2))); paras = []; for (var c = 0; c < n; c++) paras.push(sent.slice(Math.floor(c * sent.length / n), Math.floor((c + 1) * sent.length / n)).join(' ')); }
    if (paras.length > 6) { var m = []; for (var k = 0; k < 6; k++) m.push(paras.slice(Math.floor(k * paras.length / 6), Math.floor((k + 1) * paras.length / 6)).join(' ')); paras = m; }
    var chapters = paras.map(function (p, i) { var f = Object.keys(WORDS).filter(function (w) { return WORDS[w].test(p) && (w !== 'boss' || i === paras.length - 1); }); if (i === paras.length - 1 && f.indexOf('boss') < 0 && WORDS.boss.test(story)) f.push('boss'); return { text: p, seed: hash(p + i), feats: f }; });

  // ---------- questions ----------

    { k: 'attack', en: 'How does your hero attack?', ar: 'البطل بيضرب إزاي؟', o: [['sword', 'Sword swing', 'ضربة سيف'], ['shoot', 'Shoots', 'بيضرب نار'], ['stomp', 'Jumps on enemies', 'بينط على الأعداء'], ['none', 'No attack, only hide', 'من غير ضرب، بيستخبى بس']] },
    { k: 'enemy', en: 'Enemies look like…', ar: 'الأعداء شكلهم…', o: [['square', 'Squares', 'مربعات'], ['triangle', 'Triangles', 'مثلثات'], ['circle', 'Circles', 'دواير']] },
    { k: 'level', en: 'How hard?', ar: 'صعوبتها قد إيه؟', o: [['1', 'Easy', 'سهلة'], ['2', 'Normal', 'عادية'], ['3', 'Hard', 'صعبة']] },
    { k: 'goal', en: 'To finish a chapter you…', ar: 'علشان تخلّص الفصل…', o: [['stars', 'Collect all stars', 'تلمّ كل النجوم'], ['exit', 'Reach the exit door', 'توصل لباب الخروج'], ['clear', 'Beat all enemies', 'تهزم كل الأعداء']] },
    { k: 'hand', en: 'Controls on the phone', ar: 'التحكم على الموبايل', o: [['r', 'Joystick left, buttons right', 'الجويستيك شمال والزراير يمين'], ['l', 'Joystick right, buttons left', 'الجويستيك يمين والزراير شمال']] }
  ];
  var draft = null;
  function newDraft() { return { id: 'g' + Date.now(), title: '', story: '', ans: { type: 'adv', shape: 'circle', color: '#22c55e', attack: 'sword', enemy: 'square', level: '2', goal: 'stars', hand: 'r' }, v: 1, remote: null }; }
  function renderQs() {

    Q.forEach(function (q) {
      var d = document.createElement('div'); d.className = 'q'; var h = document.createElement('h3'); h.textContent = T(q.en, q.ar); d.appendChild(h);

        if (q.c) { var s = document.createElement('span'); s.className = 'sw'; s.style.background = op; b.appendChild(s); b.setAttribute('aria-label', op); }

    var goalOk = a.goal === 'stars' ? !L.stars.length : a.goal === 'clear' ? !L.enemies.some(function (e) { return e.alive; }) : true;
    if (L.boss && L.boss.alive) goalOk = false;
    if (L.keyAt && !G.key) goalOk = false;
    var atExit = Math.hypot(L.exit.x - h.x, L.exit.y - h.y) < 34;
    if (a.goal === 'exit' ? atExit && goalOk : goalOk && (atExit || a.goal !== 'exit')) {
      if (a.goal !== 'exit' && !atExit) { if (!G.exitMsg) { G.exitMsg = 1; toast(T('Done! Go to the door', 'خلصت! روح للباب'), 1600); } } else { G.exitMsg = 0; chapterDone(); }
    }
  }
  function dmg(e) { e.hp--; beep(700, 0.05); if (e.hp <= 0) { e.alive = false; if (e.boss) toast(G.spec.villain + T(' is beaten!', ' اتهزم!'), 1500); } }

  function draw() {
    var W = innerWidth, Hh = innerHeight; cx.clearRect(0, 0, W, Hh);
    if (!G || !G.L) { cx.fillStyle = '#020617'; cx.fillRect(0, 0, W, Hh); return; }
    var L = G.L, h = G.hero, M = L.mood;
    var gr = cx.createLinearGradient(0, 0, 0, Hh); gr.addColorStop(0, M[0]); gr.addColorStop(1, M[1]); cx.fillStyle = gr; cx.fillRect(0, 0, W, Hh);
    var zoom = Math.min(1.25, Math.max(0.7, Math.min(W, Hh) / 560));
    var camX = h.x - W / 2 / zoom, camY = h.y - Hh / 2 / zoom;
    if (G.shake) { camX += (Math.random() - 0.5) * 8; camY += (Math.random() - 0.5) * 8; }
    // background shapes (circles, squares, triangles) for depth
    cx.globalAlpha = 0.12; for (var i = 0; i < 14; i++) { var bx = ((i * 197 - camX * 0.2) % (W + 200) + W + 200) % (W + 200) - 100, by = (i * 89) % Hh; cx.fillStyle = '#fff'; cx.beginPath(); if (i % 3 === 0) cx.arc(bx, by, 30 + i * 3, 0, 7); else if (i % 3 === 1) cx.rect(bx, by, 40 + i * 2, 40 + i * 2); else { cx.moveTo(bx, by - 30); cx.lineTo(bx + 30, by + 25); cx.lineTo(bx - 30, by + 25); } cx.fill(); } cx.globalAlpha = 1;
    cx.save(); cx.scale(zoom, zoom); cx.translate(-camX, -camY);
    var x0 = Math.max(0, Math.floor(camX / TS)), x1 = Math.min(L.W, Math.ceil((camX + W / zoom) / TS) + 1), y0 = Math.max(0, Math.floor(camY / TS)), y1 = Math.min(L.H, Math.ceil((camY + Hh / zoom) / TS) + 1);
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) {
      var v = L.m[y][x], X = x * TS, Y = y * TS;
      if (v === 1) { cx.fillStyle = M[2]; cx.fillRect(X, Y, TS, TS); cx.fillStyle = 'rgba(255,255,255,.12)'; cx.fillRect(X, Y, TS, 5); cx.fillStyle = 'rgba(0,0,0,.18)'; cx.fillRect(X, Y + TS - 4, TS, 4); }
      else if (v === 2) { cx.fillStyle = 'rgba(56,189,248,.55)'; cx.fillRect(X, Y, TS, TS); }
      else if (v === 3) { cx.fillStyle = (Math.floor(performance.now() / 200) + x) % 2 ? '#f97316' : '#ef4444'; cx.fillRect(X, Y, TS, TS); }
      else if (!L.plat) { cx.fillStyle = (x + y) % 2 ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.06)'; cx.fillRect(X, Y, TS, TS); }
    }
    // exit door
    var ex = L.exit, open = !(L.keyAt && !G.key);
    cx.fillStyle = open ? '#22c55e' : '#7f1d1d'; if (cx.roundRect) { cx.beginPath(); cx.roundRect(ex.x - 16, ex.y - 26, 32, 46, 8); cx.fill(); } else cx.fillRect(ex.x - 16, ex.y - 26, 32, 46);
    cx.fillStyle = '#fde68a'; cx.beginPath(); cx.arc(ex.x + 8, ex.y, 3, 0, 7); cx.fill();
    if (L.keyAt && !G.key) { cx.strokeStyle = '#facc15'; cx.lineWidth = 4; cx.beginPath(); cx.arc(L.keyAt.x - 6, L.keyAt.y, 7, 0, 7); cx.moveTo(L.keyAt.x + 1, L.keyAt.y); cx.lineTo(L.keyAt.x + 16, L.keyAt.y); cx.stroke(); }
    var tt = performance.now() / 300;
    L.stars.forEach(function (s) { cx.save(); cx.translate(s.x, s.y + Math.sin(tt + s.x) * 3); cx.rotate(tt * 0.5); cx.fillStyle = '#facc15'; cx.beginPath(); for (var k = 0; k < 10; k++) { var r = k % 2 ? 6 : 13, a = k * Math.PI / 5; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } cx.closePath(); cx.fill(); cx.restore(); });
    L.enemies.forEach(function (e) { if (!e.alive) return; shape(e.boss ? 'triangle' : G.ans.enemy, e.x, e.y, e.r, e.boss ? '#7f1d1d' : '#ef4444', 0); if (e.boss) { cx.fillStyle = '#fff'; cx.font = 'bold 13px system-ui'; cx.textAlign = 'center'; cx.fillText(G.spec.villain + ' ' + '♥'.repeat(e.hp), e.x, e.y - e.r - 10); } });
    G.shots.forEach(function (s) { cx.fillStyle = '#fde047'; cx.beginPath(); cx.arc(s.x, s.y, 6, 0, 7); cx.fill(); });
    if (!h.hid) { cx.globalAlpha = G.inv > 0 && Math.floor(G.inv * 10) % 2 ? 0.4 : 1; shape(G.ans.shape, h.x, h.y, h.r, G.ans.color, L.plat ? 0 : 0); cx.globalAlpha = 1; }
    else { cx.strokeStyle = 'rgba(255,255,255,.5)'; cx.setLineDash([4, 4]); cx.beginPath(); cx.arc(h.x, h.y, h.r + 4, 0, 7); cx.stroke(); cx.setLineDash([]); }
    if (G.swing) { cx.strokeStyle = 'rgba(255,255,255,.8)'; cx.lineWidth = 6; cx.beginPath(); cx.arc(h.x, h.y, 50, h.face > 0 ? -1 : Math.PI - 1, h.face > 0 ? 1 : Math.PI + 1); cx.stroke(); }
    cx.fillStyle = '#fff'; cx.font = 'bold 12px system-ui'; cx.textAlign = 'center'; cx.fillText(G.spec.hero, h.x, h.y - h.r - 8);
    cx.restore();
    if (L.feats.indexOf('night') >= 0 || L.feats.indexOf('space') >= 0) { var rg = cx.createRadialGradient(W / 2, Hh / 2, 80, W / 2, Hh / 2, Math.max(W, Hh) * 0.6); rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.7)'); cx.fillStyle = rg; cx.fillRect(0, 0, W, Hh); }
  }
  var ac = null; function beep(f, d) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); var o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.value = 0.04; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch (e) {} }

  function applyLang() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = lang === 'en' ? el.dataset.en : el.dataset.ar; });
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.dataset.l; try { localStorage.setItem('aser_lang', lang); } catch (e) {} applyLang(); if (!$('pAsk').hidden) renderQs(); else if (!$('pHome').hidden) home(); }; });
  applyLang(); home();
})();
</script>
