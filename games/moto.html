    cx.restore();
    if (b.dead) { // rider tumbling
      var t = b.deadT; cx.save(); cx.translate(X(b.b.x + t * 1.5), Y(b.b.y + 0.6 + t * 2 - t * t * 6)); cx.rotate(t * 8);
      cx.fillStyle = '#1d4ed8'; cx.fillRect(-S * 0.12, -S * 0.3, S * 0.24, S * 0.6); cx.fillStyle = '#facc15'; cx.beginPath(); cx.arc(0, -S * 0.45, S * 0.22, 0, 7); cx.fill(); cx.restore();
    }
  }

  // ---------- 3D view (three.js + Blender models) ----------
  var THREE = null, GLTF = null, R3 = null, camI = 0;
  Promise.all([import('three'), import('three/addons/loaders/GLTFLoader.js')]).then(function (m) {
    THREE = m[0]; GLTF = new m[1].GLTFLoader();
    var need = ['bike', 'person'], got = {};
    need.forEach(function (n) { GLTF.load('models/' + n + '.glb', function (g) { got[n] = g.scene; if (Object.keys(got).length === need.length) init3(got); }, undefined, function () {}); });
  }).catch(function () {});
  function init3(models) {
    var r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.shadowMap.enabled = true; r.outputColorSpace = THREE.SRGBColorSpace;
    r.domElement.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;display:block'; document.body.insertBefore(r.domElement, cv); cv.style.display = 'none';
    var sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
    var hemi = new THREE.HemisphereLight(0xffffff, 0x334155, 1.1), sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, far: 80 }); sc.add(hemi, sun, sun.target);
    var bike3 = new THREE.Group(), inner = models.bike; inner.position.y = -0.42; bike3.add(inner);
    var wheels = ['WheelR', 'WheelF'].map(function (n) { var w = inner.getObjectByName(n), p = new THREE.Group(); p.position.copy(w.position); inner.add(p); w.position.set(0, 0, 0); p.add(w); return p; });
    var rider = models.person; rider.scale.setScalar(0.8); rider.position.set(-0.25, 0.25, 0); rider.rotation.y = Math.PI / 2; inner.add(rider);
    ['LegL', 'LegR'].forEach(function (n) { var l = rider.getObjectByName(n); if (l) l.rotation.x = -1.2; });
    ['ArmL', 'ArmR'].forEach(function (n) { var a = rider.getObjectByName(n); if (a) a.rotation.x = -1.1; });
    var body = rider.getObjectByName('Body'); if (body) body.rotation.x = 0.35;
    inner.traverse(function (o) { if (o.isMesh) o.castShadow = true; }); sc.add(bike3);
    var flag = new THREE.Group(), pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 4), new THREE.MeshStandardMaterial({ color: 0xffffff })); pole.position.y = 2; flag.add(pole);
    var cc = document.createElement('canvas'); cc.width = cc.height = 64; var g2 = cc.getContext('2d'); for (var a = 0; a < 4; a++) for (var b = 0; b < 4; b++) { g2.fillStyle = (a + b) % 2 ? '#111' : '#fff'; g2.fillRect(a * 16, b * 16, 16, 16); }
    var fl = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cc), side: THREE.DoubleSide })); fl.position.set(0.72, 3.4, 0); flag.add(fl); sc.add(flag);
    var dust = []; for (var i = 0; i < 40; i++) { var d = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true })); d.visible = false; sc.add(d); dust.push(d); }
    R3 = { r: r, sc: sc, cam: cam, sun: sun, hemi: hemi, bike: bike3, wheels: wheels, rider: rider, flag: flag, dust: dust, built: null, world: null, snap: true };
    function size() { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
    addEventListener('resize', size); size();
  }
  function build3() {
    var sc = R3.sc; if (R3.world) { sc.remove(R3.world); R3.world.traverse(function (o) { if (o.geometry) o.geometry.dispose(); }); }
    var w = new THREE.Group(); R3.world = w; sc.add(w); R3.built = H;
    sc.background = new THREE.Color(LV.sky[1]); sc.fog = new THREE.Fog(LV.sky[1], 40, 140);
    var n = H.length, top = [], front = [], ti = [], fi = [];
    for (var i = 0; i < n; i++) { var x = i * STEP, y = H[i]; top.push(x, y, -3, x, y, 3); front.push(x, y, 3, x, y - 40, 3); }
    for (i = 0; i < n - 1; i++) { var a = i * 2; ti.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); fi.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    function mesh(p, idx, col, rough) { var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setIndex(idx); g.computeVertexNormals(); var m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: col, roughness: rough, side: THREE.DoubleSide, flatShading: true })); m.receiveShadow = true; w.add(m); return m; }
    mesh(top, ti, LV.top, 0.8); mesh(front, fi, LV.ground, 0.95);
    // far hills made of circles, squares and triangles
    for (i = 0; i < 70; i++) {
      var k = i % 3, geo = k === 0 ? new THREE.SphereGeometry(4 + (i % 5), 14, 10) : k === 1 ? new THREE.BoxGeometry(6, 6 + (i % 4) * 2, 6) : new THREE.ConeGeometry(5, 10 + (i % 4) * 3, 4);
      var d = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(LV.sky[0]).lerp(new THREE.Color(LV.ground), 0.35 + (i % 4) * 0.1), roughness: 1, flatShading: true }));
      d.position.set(i * LV.len / 60 - 20, gy(i * LV.len / 60) - 6 + (k === 1 ? 3 : 0), -18 - (i % 5) * 6); d.rotation.y = i; w.add(d);
    }
    R3.flag.position.set(LV.finish, gy(LV.finish), -1.5); R3.snap = true;
  }
  function draw() {
    if (!R3) return draw2d();
    if (R3.built !== H) build3();
    var b = bike, mx = (b.r.x + b.f.x) / 2, my = (b.r.y + b.f.y) / 2, a = Math.atan2(b.f.y - b.r.y, b.f.x - b.r.x);
    R3.bike.position.set(mx, my, 0); R3.bike.rotation.z = a;
    R3.wheels[0].rotation.z = b.spinR; R3.wheels[1].rotation.z = b.spinF;
    if (b.dead) { var t = b.deadT; R3.rider.position.set(-0.25 + t * 1.5, 0.25 + t * 2 - t * t * 6, 0); R3.rider.rotation.z = t * 8; }
    else { R3.rider.position.set(-0.25, 0.25, 0); R3.rider.rotation.z = 0; }
    particles.forEach(function (p, i) { var d = R3.dust[i]; if (!d) return; d.visible = true; d.position.set(p.x, p.y, 0.5); d.material.color.set(p.c); d.material.opacity = 1 - p.t / 0.8; });
    for (var i = particles.length; i < R3.dust.length; i++) R3.dust[i].visible = false;
    var want = new THREE.Vector3(), look = new THREE.Vector3(mx + 3, my + 0.5, 0), far = innerWidth < innerHeight ? 1.6 : 1;
    if (camI === 0) want.set(mx + 3, my + 2, 13 * far); else if (camI === 1) want.set(mx - 6, my + 3.5, 8 * far); else want.set(mx + 4, my + 6, 24 * far);
    if (R3.snap) { R3.cam.position.copy(want); R3.snap = false; } else R3.cam.position.lerp(want, 0.1);
    R3.cam.lookAt(look);
    R3.sun.position.set(mx + 8, my + 20, 12); R3.sun.target.position.set(mx, my, 0);
    R3.r.render(R3.sc, R3.cam);
  }
  // ---------- sound ----------
  var ac = null, osc = null, gain = null;
  function audio() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); osc = ac.createOscillator(); gain = ac.createGain(); osc.type = 'sawtooth'; osc.frequency.value = 60; gain.gain.value = 0; osc.connect(gain); gain.connect(ac.destination); osc.start(); } catch (e) {} }
  function engine(on, sp) { if (!ac) return; osc.frequency.value = 55 + Math.min(140, sp * 6) + (on ? 20 : 0); gain.gain.value = state === 'play' ? (on ? 0.035 : 0.015) : 0; }
  function beep(f, d, type) { if (!ac) return; try { var o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'triangle'; o.frequency.value = f; g.gain.value = 0.05; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch (e) {} }
  addEventListener('pointerdown', audio, { once: true }); addEventListener('keydown', audio, { once: true });

  // ---------- screens ----------
  var state = 'menu';
  function toast(m, ms) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('on'); }, ms || 1500); }
  function hud(on) { document.body.classList.toggle('playing', on); $('hudM').hidden = !on; $('padL').hidden = !on; $('padR').hidden = !on; $('keysHint').hidden = !on; }
  function menu() {
    state = 'menu'; hud(false); $('end').hidden = true; $('menu').hidden = false;
    var done = store.get('moto_done', 0), best = store.get('moto_best', {}), box = $('levels'); box.innerHTML = '';
    LEVELS.forEach(function (l, i) {
      var b = document.createElement('button'); b.type = 'button'; b.disabled = i > done; if (best[i]) b.className = 'done';
      var n = document.createElement('b'); n.textContent = (i + 1) + '. ' + (lang === 'en' ? l.en : l.ar); b.appendChild(n);
      var s = document.createElement('small'); s.textContent = i > done ? T('Locked', 'مقفولة') : best[i] ? T('Best: ', 'أحسن وقت: ') + best[i].toFixed(1) + 's' : T('Play', 'العب'); b.appendChild(s);
      b.onclick = function () { start(i); }; box.appendChild(b);
    });
  }
  function start(i) { build(i); reset(); cam.x = bike.b.x; cam.y = bike.b.y; state = 'play'; $('menu').hidden = true; $('end').hidden = true; hud(true); $('hLvl').textContent = (i + 1) + '. ' + (lang === 'en' ? LV.en : LV.ar); toast(T('Gas to go!', 'دوس بنزين وانطلق!'), 1400); }
  function finish() {
    bike.done = true; state = 'end'; hud(false); beep(660, 0.15); setTimeout(function () { beep(990, 0.3); }, 150);
    var best = store.get('moto_best', {}), t = stats.t, rec = !best[lvI] || t < best[lvI];
    if (rec) { best[lvI] = t; store.set('moto_best', best); }
    store.set('moto_done', Math.max(store.get('moto_done', 0), lvI + 1));
    var par = LV.len / 9, stars = t < par ? 3 : t < par * 1.4 ? 2 : 1;
    $('eTitle').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars) + ' ' + T('Finished!', 'وصلت!');
    $('eText').textContent = T('Time ' + t.toFixed(1) + 's · flips ' + stats.flips + ' · longest wheelie ' + stats.best.toFixed(1) + 's', 'الوقت ' + t.toFixed(1) + ' ث · شقلبات ' + stats.flips + ' · أطول ويلي ' + stats.best.toFixed(1) + ' ث') + (rec ? T(' · New record!', ' · رقم جديد!') : '');
    var last = lvI === LEVELS.length - 1;
    $('eNext').textContent = last ? T('Play again', 'العب تاني') : T('Next level', 'المرحلة الجاية'); $('eNext').onclick = function () { start(last ? 0 : lvI + 1); };
    $('end').hidden = false;
  }
  function cyc() { camI = (camI + 1) % 3; toast([T('Side', 'جنب'), T('Behind', 'ورا'), T('Far', 'بعيد')][camI], 800); }
  $('bCam').onclick = cyc; addEventListener('keydown', function (e) { if (e.code === 'KeyC' && state === 'play') cyc(); });
  $('eAgain').onclick = function () { start(lvI); }; $('eMenu').onclick = menu; $('bBack').onclick = menu; $('bRestart').onclick = function () { start(lvI); };
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { setLang(b.dataset.l); menu(); }; });
  setLang(lang); build(0); reset(); menu();

  var last = performance.now(), acc = 0, DT = 1 / 120;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') {
      acc += dt; while (acc >= DT) { physics(DT); acc -= DT; }
      if (stats.started && !bike.dead) stats.t += dt;
      if (bike.dead) { bike.deadT += dt; if (bike.deadT > 1.3) { start(lvI); toast(T('Crashed! Try again', 'وقعت! جرّب تاني'), 1300); } }
      $('hTime').textContent = stats.t.toFixed(1) + 's';
      $('hFlip').textContent = T('Flips ', 'شقلبات ') + stats.flips;
      $('hProg').textContent = Math.max(0, Math.min(100, Math.round(bike.r.x / LV.finish * 100))) + '%';
    } else { bike.b.x += dt * 4; bike.r.x += dt * 4; bike.f.x += dt * 4; if (bike.b.x > LV.finish) reset(); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
