<script type="module">
import { THREE, makeWorld, mat, walls, makeChar, moveCircle, readInput, hit, endFrame, setupJoystick, bindButton, beep, follow, T, setLang, L, store, view, preload } from './engine.js';
import { setupEco, xpFor, egp } from './aw_eco.js?v=V52';
import { setupFight } from './aw_fight.js?v=V52';
import { setupDungeon } from './aw_dungeon.js?v=V52';
const $ = id => document.getElementById(id);
await preload(['person']);

// ================= WORLD LAYOUT — copied from Unity AserSkyWorld.cs ComputeSky() =================
// Unity: ring radius R = 2600, every ring island the size of the middle one (S), angles 22.5° + i·45°.
// Web scale K = 1/7 for positions and sizes (S ≈ 1400 in Unity → 200 here). Buildings stay real size.
const K = 1 / 7, S = 200, R = 2600 * K;
const BMain = 0, BLava = 1, BIce = 2, BDead = 3, BEstate = 4, BFun = 5, BLake = 6, BBoss = 7, BSky = 8, BSecret = 9, BZombie = 10, BCave = 11, BXmas = 12, BRace = 13;
const AR = { 'ASER TOWN': 'ASER TOWN', 'BIG LAKE (FISHING)': 'البحيرة الكبيرة (صيد)', 'FROZEN ISLAND': 'جزيرة الجليد', 'ASER CITY': 'ASER CITY', 'VOLCANO ISLAND': 'جزيرة البركان', 'DEAD FOREST': 'الغابة الميتة', 'ZOMBIE ISLAND': 'جزيرة الزومبي', 'THE FORGE CAVES': 'كهوف الورشة', 'ARCADE ISLAND': 'جزيرة الألعاب', 'RACE TRACK': 'حلبة السباق', 'CHRISTMAS ISLAND': 'جزيرة الكريسماس', 'BOSS ISLAND (EVENTS)': 'جزيرة البوس (إيفنتات)', 'SKY ARENA (EVENTS)': 'ساحة السما (إيفنتات)', '???': '???' };
const nameOf = s => T(s.name, AR[s.name] || s.name);
const C = (r, g, b) => new THREE.Color(r, g, b).getHex();
const g1 = C(0.3, 0.5, 0.22), d1 = C(0.42, 0.3, 0.2);
const islands = [];
function add(name, x, z, size, biome, bridge, top, side) { const s = { name, x, z, size, biome, bridge, top, side, gates: [] }; islands.push(s); return s; }
const main = add('ASER TOWN', 0, 0, S, BMain, true, g1, d1);
const NM = ['BIG LAKE (FISHING)', 'FROZEN ISLAND', 'ASER CITY', 'VOLCANO ISLAND', 'DEAD FOREST', 'ZOMBIE ISLAND', 'THE FORGE CAVES', 'ARCADE ISLAND'];
const BI = [BLake, BIce, BEstate, BLava, BDead, BZombie, BCave, BFun];
const TC = [g1, C(0.9, 0.95, 1), g1, C(0.17, 0.14, 0.13), C(0.42, 0.38, 0.34), C(0.28, 0.3, 0.22), C(0.45, 0.43, 0.42), g1];
const SC = [d1, C(0.55, 0.7, 0.85), d1, C(0.22, 0.17, 0.15), C(0.23, 0.19, 0.16), C(0.2, 0.18, 0.15), C(0.3, 0.29, 0.3), d1];
const ring = [];
for (let i = 0; i < 8; i++) { const a = (22.5 + i * 45) * Math.PI / 180; ring.push(add(NM[i], Math.sin(a) * R, Math.cos(a) * R, S, BI[i], true, TC[i], SC[i])); }
const xmas = add('CHRISTMAS ISLAND', 0, 6200 * K, S, BXmas, false, C(0.95, 0.97, 1), C(0.6, 0.7, 0.85)); xmas.eventOnly = true;
const race = add('RACE TRACK', -9500 * K, 2500 * K, 900 * K, BRace, false, g1, d1);
add('BOSS ISLAND (EVENTS)', 9000 * K, -9000 * K, 320 * K, BBoss, false, C(0.3, 0.28, 0.3), C(0.25, 0.22, 0.25)).eventOnly = true;
add('SKY ARENA (EVENTS)', -9000 * K, -9000 * K, 320 * K, BSky, false, C(0.55, 0.75, 0.95), C(0.4, 0.5, 0.7)).eventOnly = true;
add('???', -17000 * K, 17000 * K, 160 * K, BSecret, false, C(0.35, 0.25, 0.45), C(0.25, 0.18, 0.3)).hidden = true;
const island = b => islands.find(s => s.biome === b);
// same gate maths as Unity: middle ↔ ring uses EdgeHit, ring ↔ ring uses SideGate
function edgeHit(s, to) { const dx = to.x - s.x, dz = to.z - s.z, h = s.size / 2; const k = Math.min(Math.abs(dx) > .01 ? h / Math.abs(dx) : 1e9, Math.abs(dz) > .01 ? h / Math.abs(dz) : 1e9); return { x: s.x + dx * k, z: s.z + dz * k }; }
function sideGate(s, to) { const dx = to.x - s.x, dz = to.z - s.z, h = s.size / 2; return Math.abs(dx) >= Math.abs(dz) ? { x: s.x + Math.sign(dx) * h, z: s.z } : { x: s.x, z: s.z + Math.sign(dz) * h }; }
const links = [];
function link(a, b) { const r = a.biome !== BMain && b.biome !== BMain; const ga = r ? sideGate(a, b) : edgeHit(a, b), gb = r ? sideGate(b, a) : edgeHit(b, a); a.gates.push(ga); b.gates.push(gb); links.push({ a, b, ga, gb }); }
for (const r of ring) link(main, r);
for (let i = 0; i < 8; i++) link(ring[i], ring[(i + 1) % 8]);
// special places (Unity offsets × K)
const fun = island(BFun), lake = island(BLake), cave = island(BCave), zom = island(BZombie), city = island(BEstate);
const P = (s, dx, dz) => ({ x: s.x + dx * K, z: s.z + dz * K });
const PLACES = {
  racePortal: P(fun, -150, -150), raceReturn: { x: race.x, z: race.z - race.size / 2 + 20 * K }, arcade: P(fun, 60, 0),
  lake: { x: lake.x, z: lake.z, r: 110 * K * 2.2 }, elevator: { x: cave.x, z: cave.z }, dungeon: P(zom, 240, 240), police: P(city, -170, 170)
};

// ================= SCENE =================
const { renderer, scene, camera, sun } = makeWorld({ sky: 0x8ec5ff, fog: 0x9fd0ff, fogNear: 120, fogFar: 520, ambient: 0.75, sun: 1.6 });
camera.far = 1400; camera.updateProjectionMatrix();
sun.shadow.camera.far = 160; sun.shadow.camera.updateProjectionMatrix();
// blue ground far below (Unity VoidY)
const voidM = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), mat(0x3a7aeb)); voidM.rotation.x = -Math.PI / 2; voidM.position.y = -260 * K * 3; scene.add(voidM);

// instanced helpers — thousands of boxes in a few draw calls (phone friendly)
const inst = {};
function put(kind, geo, color, x, y, z, sx, sy, sz, ry, opt) {
  const key = kind + color; let b = inst[key];
  if (!b) b = inst[key] = { geo, m: mat(color, opt), list: [] };
  b.list.push([x, y, z, sx, sy, sz, ry || 0]);
}
const BOX = new THREE.BoxGeometry(1, 1, 1), CYL = new THREE.CylinderGeometry(0.5, 0.5, 1, 10), CONE = new THREE.ConeGeometry(0.5, 1, 8), BALL = new THREE.SphereGeometry(0.5, 12, 8);
function flush() {
  const o = new THREE.Object3D();
  for (const k in inst) {
    const b = inst[k]; const im = new THREE.InstancedMesh(b.geo, b.m, b.list.length);
    b.list.forEach((p, i) => { o.position.set(p[0], p[1], p[2]); o.scale.set(p[3], p[4], p[5]); o.rotation.set(0, p[6], 0); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
    im.castShadow = im.receiveShadow = true; scene.add(im);
  }
}
const solid = (x, z, w, d) => walls.push({ x0: x - w / 2, z0: z - d / 2, x1: x + w / 2, z1: z + d / 2, tall: false });
const block = (x, z, w, d, h, color, y) => { put('b', BOX, color, x, (y || 0) + h / 2, z, w, h, d); solid(x, z, w, d); };
const deco = (x, z, w, d, h, color, y) => put('b', BOX, color, x, (y || 0) + h / 2, z, w, h, d);
function label(text, color, size, x, y, z) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 160; const g = c.getContext('2d');
  g.font = '900 92px system-ui,Segoe UI'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 14; g.strokeStyle = 'rgba(0,0,0,.7)';
  g.strokeText(text, 512, 84); g.fillStyle = color; g.fillText(text, 512, 84);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthWrite: false, fog: false }));
  sp.scale.set(size * 6.4, size, 1); sp.position.set(x, y, z); scene.add(sp); return sp;
}
let seed = 77; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const inIsl = (s, m) => ({ x: s.x + (rnd() - 0.5) * (s.size - (m || 20)), z: s.z + (rnd() - 0.5) * (s.size - (m || 20)) });
const treesPos = [];
function tree(x, z, leaf, trunk, s) { s = s || 1; treesPos.push({ x, z }); put('c', CYL, trunk || 0x6b4423, x, 1.6 * s, z, 0.5 * s, 3.2 * s, 0.5 * s); put('k', CONE, leaf || 0x2f7d32, x, 4.4 * s, z, 3.2 * s, 4.4 * s, 3.2 * s); solid(x, z, 0.8 * s, 0.8 * s); }
function deadTree(x, z) { put('c', CYL, 0x3a2f28, x, 2.5, z, 0.45, 5, 0.45); put('b', BOX, 0x3a2f28, x + 0.8, 3.6, z, 1.8, 0.25, 0.25, rnd() * 3); solid(x, z, 0.8, 0.8); }

// islands + walls with gate gaps (Unity: lobby-wall copy around every island)
for (const s of islands) {
  if (s.hidden || s.eventOnly) continue;
  put('b', BOX, s.top, s.x, -0.5, s.z, s.size, 1, s.size);
  put('b', BOX, s.side, s.x, -9, s.z, s.size - 2, 16, s.size - 2);
  put('k', CONE, s.side, s.x, -28, s.z, s.size * 0.7, 30, s.size * 0.7);
  if (s.biome === BRace || s.biome === BMain && false) continue;
  const h = s.size / 2, wc = s.biome === BIce ? 0xdbeafe : s.biome === BLava ? 0x3f2a22 : 0x9aa0a6;
  for (const side of [0, 1, 2, 3]) {

  else if (tab === 4) { app('👥', 'FRIENDS', 'الأصحاب'); app('💬', 'CHAT', 'الشات'); }
  else { app('🎒', 'BACKPACK', 'الشنطة', () => { phone(false); eco.bag(); }); app('🌐', 'LANGUAGE', 'اللغة', () => { setLang(L() === 'ar' ? 'en' : 'ar'); rebuildLabelsNote(); phone(true); }); app('📊', 'CHARTS', 'الترتيب'); app('🎁', 'CODES + REDEEM', 'الأكواد'); app('🛟', 'HELP + SUPPORT', 'المساعدة', () => toast(T('Support is on Discord only', 'الدعم على Discord بس'))); }
}
function rebuildLabelsNote() { toast(T('Reload to change the 3D signs language', 'اعمل ريفريش عشان لغة اليفط تتغير')); }

// ================= PHASE 2: farming · mining · workshop (aw_eco.js) =================
function panel(title, fill) { $('pTitle2').textContent = title; const b = $('pBody'), y = b.scrollTop; b.innerHTML = ''; fill(b); $('panel').hidden = false; b.scrollTop = y; }
$('pX').onclick = () => { $('panel').hidden = true; };
const SHOP = { seedShop: { x: 22, z: 18 }, sell: { x: -22, z: 18 }, forge: { x: -22, z: -18 }, fruit: { x: 40, z: 0 } };
const eco = setupEco({ scene, me, pos, toast: m => toast(m), save, gainXp, trees: treesPos, panel, places: { ...SHOP, garden: GARDEN, cave: { x: cave.x, z: cave.z } } });
const goShop = p => { pos.set(p.x, 0, p.z + 9); phone(false); };
// ================= PHASE 3: fruits · fighting styles · monsters (aw_fight.js) =================
const FIGHT_ISL = ring.map(s => ({ name: s.name, x: s.x, z: s.z, size: s.size, zombie: s.biome === BZombie, mobs: [BIce, BLava, BDead, BCave].includes(s.biome), lava: s.biome === BLava }));
const pillars = []; for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; pillars.push({ x: zom.x + Math.sin(a) * 50, z: zom.z + Math.cos(a) * 50 }); }
const fight = setupFight({ scene, me, pos, player, camera, toast: m => toast(m), save, gainXp, panel, maxHp: () => maxHp(), islands: FIGHT_ISL, zombie: { pillars },
  redraw: () => eco.drawBar(), move: (dx, dz) => moveCircle(pos, dx, dz, 0.45), jump: v => { vy = v; onGround = false; },
  hurtMe: d => { if (state !== 'play') return; me.hp -= d; beep(120, 0.1, 'square', 0.05); if (me.hp <= 0) { spawn(); onGround = true; me.hp = maxHp(); toast(T('You were defeated! Back to ASER TOWN', 'خسرت! رجعت ASER TOWN')); save(); } } });
// ================= PHASE 4: dungeon gates E–S + 6 far dungeons (aw_dungeon.js) =================
const dng = setupDungeon({ scene, me, pos, fight, toast: m => toast(m), save, gainXp, panel, floors: EXTRA_FLOORS, label, goTown: () => { spawn(); onGround = true; } });
eco.link({ fruit: fight.fruitName, style: fight.styleName, fruitShop: fight.fruitShop, prompt: dng.prompt });
// phone buttons for moves (Z X C V) + attack, shown when you hold the fruit (2) or a style (3) / sword (1)
function moveButtons() { const h = me.held; $('mv').hidden = !(h === 1 || h === 2 || h === 3); ['mZ', 'mX', 'mC', 'mV'].forEach((id, i) => { $(id).hidden = !(h === 2 || (h === 3 && i < 2)); }); }

// ================= INPUT / UI =================
setupJoystick(); bindButton('jumpB', 'Space'); bindButton('runB', 'Run'); bindButton('useB', 'KeyE');
bindButton('mAtk', 'KeyF'); bindButton('mZ', 'KeyZ'); bindButton('mX', 'KeyX'); bindButton('mC', 'KeyC'); bindButton('mV', 'KeyV');
$('bPhone').onclick = () => phone($('phone').hidden); $('pClose').onclick = () => phone(false);
$('bMap').onclick = () => { $('bigmap').hidden = !$('bigmap').hidden; }; $('bigmap').onclick = () => { $('bigmap').hidden = true; };
$('bMenu').onclick = () => { state = 'menu'; $('menu').hidden = false; $('hud').hidden = true; phone(false); };
let pvp = false; $('bPvp').onclick = () => { pvp = !pvp; $('bPvp').classList.toggle('on', pvp); toast(pvp ? T('PVP ON — only inside the arena', 'PVP شغّال — جوه الحلبة بس') : T('PVP OFF', 'PVP مقفول')); };
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
setLang(L());
let state = 'menu';
$('mPlay').onclick = () => { state = 'play'; $('menu').hidden = true; $('hud').hidden = false; hud(); toast(T('Welcome to ASER TOWN', 'أهلًا بيك في ASER TOWN')); };
$('mBack').onclick = () => { location.href = '../index.html'; };

// ================= LOOP =================
const clock = new THREE.Clock(); let lastIsl = null, hudT = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), now = performance.now();
  if (state === 'play') { eco.update(dt); fight.update(dt); dng.update(dt); moveButtons(); }
  if (state === 'play' && !$('panel').hidden && hit('Escape')) $('panel').hidden = true;
  if (state === 'play' && $('phone').hidden && $('panel').hidden) {
    eco.keys(hit); if (hit('KeyE')) eco.use(); if (hit('KeyB')) eco.bag(); fight.keys(hit, me.held);
    const inp = readInput(); const sp = (inp.run ? 16 : 8) * dt, mx = inp.x * sp, mz = inp.z * sp;
    if (hit('KeyP')) phone(true); if (hit('KeyM')) $('bigmap').hidden = !$('bigmap').hidden;
    if (onGround) { const old = { x: pos.x, z: pos.z }; moveCircle(pos, mx, mz, 0.45); }
    else { pos.x += mx * 0.6; pos.z += mz * 0.6; }
    if ((mx || mz)) player.rotation.y = Math.atan2(mx, mz);
    if (hit('Space') && onGround) { vy = 9; onGround = false; beep(520, 0.08, 'sine', 0.04); }
    const floorHere = hasFloor(pos);
    if (!onGround || !floorHere) { vy -= (fight.float() ? 6 : 24) * dt; pos.y += vy * dt; if (floorHere && pos.y <= 0 && vy <= 0) { pos.y = 0; vy = 0; onGround = true; } else onGround = false; }
    if (pos.y < -60) { spawn(); onGround = true; me.hp = Math.max(1, me.hp - 10); toast(T('You fell! Back to ASER TOWN (−10 HP)', 'وقعت! رجعت ASER TOWN (−10 HP)')); save(); }
    player.userData.anim && player.userData.anim(dt, Math.hypot(inp.x, inp.z) * (inp.run ? 1.6 : 1));
    const s = islandAt(pos);
    if (s !== lastIsl) { lastIsl = s; $('areaName').textContent = s ? nameOf(s) : onBridge(pos) ? T('BRIDGE', 'كوبري') : T('DUNGEON', 'الدانجن'); if (s && !me.seen.includes(s.name)) { me.seen.push(s.name); gainXp(25); toast(T('New place: ', 'مكان جديد: ') + nameOf(s) + ' +25 XP'); } }
    // portals: arcade island ↔ race track (Unity AserIslands2)
    const rp = PLACES.racePortal, rr = PLACES.raceReturn;
    if (Math.hypot(pos.x - rp.x, pos.z - rp.z) < 3.5) { pos.set(rr.x, 0, rr.z + 10); toast(nameOf(race)); }
    else if (Math.hypot(pos.x - rr.x, pos.z - rr.z) < 3.5) { pos.set(rp.x, 0, rp.z + 10); toast(nameOf(fun)); }
    me.hp = Math.min(maxHp(), me.hp + dt * 2);
    follow(camera, pos, dt, 3.4, 5.6, player);
    if (pos.y < 0) camera.position.y += pos.y * 0.7;
    const yaw = ((-view.yaw % 6.283) + 6.283) % 6.283; $('compass').textContent = DIRS[Math.round(yaw / 0.785) % 8];
    if ((hudT += dt) > 0.15) { hudT = 0; hud(); drawMap($('mini'), 420, pos.x, pos.z, false); if (!$('bigmap').hidden) drawMap($('bigC'), 2050, -475, 0, true); }
  } else if (state === 'menu') { const a = now / 9000; camera.position.set(Math.sin(a) * 160, 90, Math.cos(a) * 160); camera.lookAt(0, 0, 0); }
  sun.position.set(pos.x + 30, 60, pos.z + 20); sun.target.position.set(pos.x, 0, pos.z);
  renderer.render(scene, camera); endFrame();
  requestAnimationFrame(frame);
}
window.DS_GAME = { name: 'ASER WORLD', cmds: [['town', 'Back to ASER TOWN', 'ارجع ASER TOWN']], run: c => { if (c === 'town') spawn(); } };
requestAnimationFrame(frame);
</script>
