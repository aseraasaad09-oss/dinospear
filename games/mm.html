}

// ---------- people ----------

// ---------- a round (roster comes from the host, the same on every screen) ----------
function rnd(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  roster.forEach((o, i) => { const p = makePerson(Object.assign({}, o)); place(p, sp[i % sp.length]); people.push(p); });
  me = people.find(p => p.id === myId) || people[0];

// ---------- actions (the same rules for players and bots; online they are sent to everyone) ----------

// ---------- bots (run by the host only) ----------
const free = (c, r) => { const ch = grid[r]?.[c]; return ch && ch !== '#' && ch !== 'F'; };

function bot(p, dt) {
  const ai = p.ai; ai.t -= dt; let target = null, sp = 2.6;
  if (p.role === 'murderer') {
    const witnesses = q => people.filter(w => w.alive && w !== p && w !== q && dist(w.pos, p.pos) < 12 && canSee(w.pos, p.pos)).length;
    const prey = people.filter(x => x.alive && x !== p && canSee(p.pos, x.pos) && dist(x.pos, p.pos) < 14).sort((a, b) => dist(a.pos, p.pos) - dist(b.pos, p.pos))[0];
    if (prey && (witnesses(prey) === 0 || timeLeft < 60)) { target = prey.pos; sp = 4.2; if (dist(prey.pos, p.pos) < 1.7) stab(p); }
  } else {
    if (p.hasGun && p.knows && p.knows.alive && canSee(p.pos, p.knows.pos) && dist(p.pos, p.knows.pos) < 22) { p.dir = Math.atan2(p.knows.pos.x - p.pos.x, p.knows.pos.z - p.pos.z); shoot(p); }
    else if (p.knows && p.knows.alive && dist(p.pos, p.knows.pos) < 10) { target = { x: p.pos.x * 2 - p.knows.pos.x, z: p.pos.z * 2 - p.knows.pos.z }; sp = 4; ai.path = null; }
    else if (gunDrop && !p.hasGun && dist(p.pos, gunDrop.p) < 14) target = gunDrop.p;
    else { const c = coins.filter(c => c.on).sort((a, b) => dist(a.p, p.pos) - dist(b.p, p.pos))[0]; if (c && dist(c.p, p.pos) < 12 && !ai.path) ai.path = path(p.pos, c.p); }
  }
  if (!target) { if (!ai.path || !ai.path.length || ai.t < 0) { ai.path = path(p.pos, randomSpot()); ai.t = 8; } target = ai.path[0]; if (target && dist(target, p.pos) < 0.4) { ai.path.shift(); target = ai.path[0]; } }
  if (target) { const dx = target.x - p.pos.x, dz = target.z - p.pos.z, m = Math.hypot(dx, dz) || 1; moveCircle(p.pos, dx / m * sp * dt, dz / m * sp * dt, 0.35); if (!(p.hasGun && p.knows)) p.dir = Math.atan2(dx, dz); p.mv = sp / 2.6; } else p.mv = 0;
}

// ---------- the loop ----------
function step(dt) {
  timeLeft -= dt; if (timeLeft <= 0 && isHost) { finish('inn'); if (net) net.send('end', { w: 'inn' }); return; }
  const inp = readInput();
  if (me.alive) {
    const sp = (inp.run ? 5 : 3.2) * (me.crouch ? 0.5 : 1) * ((window.DS_ADM || {}).fast ? 2 : 1), mv = Math.hypot(inp.x, inp.z);
    moveCircle(me.pos, inp.x * sp * dt, inp.z * sp * dt, 0.38); if (mv > 0.05) me.dir = Math.atan2(inp.x, inp.z); me.mv = mv * (inp.run ? 1.6 : 1);
    if (hit('KeyF') || hit('Space')) { if (me.role === 'murderer') stab(me); else if (me.hasGun) shoot(me); }
    if (hit('KeyG')) { if (me.role === 'murderer') throwKnife(me); else { me.crouch = !me.crouch; toast(me.crouch ? T('Crouching — quieter and harder to see', 'موطّي — أهدى وأصعب تتشاف') : T('Standing', 'واقف'), 900); } }
    coins.forEach(c => { if (c.on && dist(c.p, me.pos) < 1) { c.on = false; c.mesh.visible = false; me.coins++; beep(1200, 0.06, 'sine'); if (net) net.send('coin', { i: coins.indexOf(c) }); } });
    if (gunDrop && dist(gunDrop.p, me.pos) < 1.2) pickGun(me);
  }
  if (isHost) people.forEach(p => { if (!p.human && p.alive) { bot(p, dt); coins.forEach((c, ci) => { if (c.on && dist(c.p, p.pos) < 0.9) { c.on = false; c.mesh.visible = false; p.coins++; if (net) net.send('coin', { i: ci }); } }); if (gunDrop && dist(gunDrop.p, p.pos) < 1.2) pickGun(p); } });
  people.forEach(p => {
    p.cd = Math.max(0, p.cd - dt); p.showKnife = Math.max(0, p.showKnife - dt);
    if (!p.alive) return;
    if (p.net) { p.pos.x += (p.net.x - p.pos.x) * 0.25; p.pos.z += (p.net.z - p.pos.z) * 0.25; p.dir = p.net.dir; p.mv = p.net.mv; }
    p.mesh.position.set(p.pos.x, 0, p.pos.z); p.mesh.rotation.y = p.dir; p.mesh.scale.y = p.crouch ? 0.75 : 1;
    p.mesh.userData.anim(dt, p.mv || 0, false); p.knife.visible = p.showKnife > 0 || (p === me && p.role === 'murderer');
  });
  for (let i = flying.length - 1; i >= 0; i--) { const f = flying[i]; f.t += dt; const nx = f.x + f.vx * dt, nz = f.z + f.vz * dt;
    const hitWall = walls.some(w => w.tall && nx > w.x0 && nx < w.x1 && nz > w.z0 && nz < w.z1); f.x = nx; f.z = nz; f.m.position.set(nx, 1, nz); f.m.rotation.y += dt * 20;
    const victim = people.find(p => p !== f.by && p.alive && Math.hypot(p.pos.x - nx, p.pos.z - nz) < 0.6);
    if (victim && !f.remote) { kill(f.by, victim, 'knife'); }
    if (victim || hitWall || f.t > 1.5) { scene.remove(f.m); flying.splice(i, 1); } }
  coins.forEach(c => { c.mesh.rotation.z += dt * 3; });
  if (net && net.tick(dt)) net.sendPos();
  hudUpd();
  const f = me.alive ? me.pos : (people.find(p => p.alive) || me).pos;
  follow(camera, f, dt, 0, 0, me.alive ? me.mesh : null);
  sun.position.set(f.x + 10, 26, f.z + 8); sun.target.position.set(f.x, 0, f.z);
}

// ---------- online rooms (Supabase Realtime: no data is saved) ----------
const myId = 'p' + Math.random().toString(36).slice(2, 8);
function myName() { try { let n = localStorage.getItem('ds_name') || ''; if (!n) { const k = Object.keys(localStorage).find(x => /^sb-.*-auth-token$/.test(x)); const j = k && JSON.parse(localStorage.getItem(k)); n = (j && (j.user || (j.currentSession || {}).user) || {}).user_metadata?.username || ''; } return n.slice(0, 12) || T('Player ', 'لاعب ') + myId.slice(-2).toUpperCase(); } catch (e) { return 'Player'; } }
function makeNet(code) {
  if (!window.supabase || !window.ASER_KEY) return null;
  const sb = window.supabase.createClient('https://djpgranztcqxyfehynux.supabase.co', window.ASER_KEY);
  const ch = sb.channel('mm-' + code, { config: { broadcast: { self: false }, presence: { key: myId } } });
  let acc = 0; const n = { code, ch, members: [], host: false };
  n.send = (ev, payload) => ch.send({ type: 'broadcast', event: ev, payload });
  n.tick = dt => { acc += dt; if (acc > 0.1) { acc = 0; return true; } return false; };
  n.sendPos = () => { n.send('p', { id: me.id, x: me.pos.x, z: me.pos.z, dir: me.dir, mv: me.mv, cr: !!me.crouch }); if (isHost) n.send('b', people.filter(p => !p.human).map(p => ({ id: p.id, x: p.pos.x, z: p.pos.z, dir: p.dir, mv: p.mv }))); };
  const by = id => people.find(p => p.id === id);
  ch.on('broadcast', { event: 'p' }, ({ payload: d }) => { const p = by(d.id); if (p && !p.local) { p.net = d; p.crouch = d.cr; } });
  ch.on('broadcast', { event: 'b' }, ({ payload: list }) => { if (isHost) return; list.forEach(d => { const p = by(d.id); if (p) p.net = d; }); });
  ch.on('broadcast', { event: 'kill' }, ({ payload: d }) => { const a = by(d.by), t = by(d.t); if (a && t) kill(a, t, d.how, true); });
  ch.on('broadcast', { event: 'stab' }, ({ payload: d }) => { const a = by(d.by), t = d.t && by(d.t); if (a) { a.cd = 0; a.showKnife = 0.8; if (t) kill(a, t, 'knife', true); } });
  ch.on('broadcast', { event: 'shoot' }, ({ payload: d }) => { const a = by(d.by); if (a) { a.cd = 0; shoot(a, true, d.t); } });
  ch.on('broadcast', { event: 'throw' }, ({ payload: d }) => { const a = by(d.by); if (a) { a.cd = 0; a.dir = d.dir; throwKnife(a, true); } });
  ch.on('broadcast', { event: 'gun' }, ({ payload: d }) => { const p = by(d.id); if (p) pickGun(p, true); });
  ch.on('broadcast', { event: 'coin' }, ({ payload: d }) => { const c = coins[d.i]; if (c) { c.on = false; c.mesh.visible = false; } });
  ch.on('broadcast', { event: 'end' }, ({ payload: d }) => finish(d.w));
  ch.on('broadcast', { event: 'start' }, ({ payload: d }) => { isHost = false; startRound(d.roster, d.seed); });
  ch.on('presence', { event: 'sync' }, () => {
    const st = ch.presenceState(); n.members = Object.keys(st).map(k => ({ id: k, name: st[k][0].name, at: st[k][0].at })).sort((a, b) => a.at - b.at);
    n.host = n.members[0] && n.members[0].id === myId; lobbyDraw();
  });
  ch.subscribe(s => { if (s === 'SUBSCRIBED') ch.track({ name: myName(), at: Date.now() }); if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') $('lMsg').textContent = T('Could not connect. Check the internet.', 'ما قدرتش أوصل. شوف النت.'); });
  return n;
}
function lobbyDraw() {
  if (!net) return; $('lRoom').textContent = net.code;
  const box = $('lPlayers'); box.innerHTML = ''; net.members.slice(0, 4).forEach((m, i) => { const s = document.createElement('span'); s.textContent = (i === 0 ? '👑 ' : '') + m.name + (m.id === myId ? T(' (you)', ' (انت)') : ''); box.appendChild(s); });
  const full = net.members.length > 4; $('lStart').hidden = !net.host || net.members.length < 2 || full;
  $('lMsg').textContent = full ? T('The room is full (4).', 'الأوضة مليانة (4).') : net.host ? (net.members.length < 2 ? T('Waiting for friends… send them the code', 'مستني صحابك… ابعتلهم الكود') : T('Ready! Press Start.', 'جاهزين! دوس ابدأ.')) : T('Waiting for the room owner to start…', 'مستنيين صاحب الأوضة يبدأ…');
}
function leave() { if (net) { try { net.ch.unsubscribe(); } catch (e) {} } net = null; isHost = true; }
$('mOnline').onclick = () => { $('menu').hidden = true; $('lobby').hidden = false; $('lRoom').textContent = ''; $('lPlayers').innerHTML = ''; $('lMsg').textContent = navigator.onLine ? '' : T('You need internet for online play.', 'اللعب أونلاين محتاج نت.'); };
$('lMake').onclick = () => { leave(); const code = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random() * 24 | 0]).join(''); net = makeNet(code); lobbyDraw(); };
$('lJoin').onclick = () => { const c = $('lCode').value.trim().toUpperCase(); if (c.length !== 4) return; leave(); net = makeNet(c); lobbyDraw(); };
$('lStart').onclick = () => { if (!net || !net.host) return; const humans = net.members.slice(0, 4).map(m => ({ id: m.id, name: m.name })); const seed = Date.now() % 1e9, roster = makeRoster(humans, seed); isHost = true; net.send('start', { roster, seed }); startRound(roster, seed); };
$('lLeave').onclick = () => { leave(); showMenu(); };

// ---------- menu ----------
function showMenu() { state = 'menu'; ['hud', 'lobby', 'end', 'role'].forEach(id => $(id).hidden = true); $('menu').hidden = false; const st = store.get('mm_stats', { w: 0, l: 0 }); $('mStats').textContent = T('Wins ' + st.w + ' · Losses ' + st.l, 'فوز ' + st.w + ' · خسارة ' + st.l); }
$('mSolo').onclick = () => { leave(); const seed = Date.now() % 1e9; startRound(makeRoster([{ id: myId, name: myName() }], seed), seed); };
$('eAgain').onclick = () => { if (net && net.host) $('lStart').onclick(); else if (net) { $('end').hidden = true; $('lobby').hidden = false; lobbyDraw(); } else $('mSolo').onclick(); };
$('eMenu').onclick = () => { leave(); showMenu(); }; $('bBack').onclick = () => { leave(); showMenu(); };
$('bCam').onclick = () => cycleView();
addEventListener('keydown', e => { if (e.code === 'KeyC' && state === 'play') $('bCam').onclick(); if (e.code === 'Escape' && state === 'play') { leave(); showMenu(); } });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { setLang(b.dataset.l); if (state === 'menu') showMenu(); });
setLang(L()); showMenu();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if ((state === 'play' || state === 'role') && me) { if (state === 'play') step(dt); else { people.forEach(p => p.mesh.userData.anim(dt, 0)); const f = me.pos; camera.position.lerp(new THREE.Vector3(f.x, 6, f.z + 5), 0.08); camera.lookAt(f.x, 1, f.z); } }
  else { const a = now / 7000; camera.position.set(Math.sin(a) * 26, 20, Math.cos(a) * 20); camera.lookAt(0, 0, 0); }
  renderer.render(scene, camera); endFrame();
  requestAnimationFrame(frame);
}
window.DS_GAME = { name: 'KILLER KILLER WARS', cmds: [['who', 'Who is the murderer?', 'مين القاتل؟'], ['gun', 'Give me the gun', 'إديني المسدس'], ['end', 'End the round (innocents win)', 'خلّص الجولة (الأبرياء كسبوا)']], run: c => { if (!me || state !== 'play') return; if (c === 'who') { const m = people.find(p => p.role === 'murderer'); return (L() === 'en' ? 'Murderer: ' : 'القاتل: ') + m.name; } if (c === 'gun' && me.role !== 'murderer') { me.hasGun = true; me.gun.visible = true; } if (c === 'end') { finish('inn'); if (net) net.send('end', { w: 'inn' }); } } };
requestAnimationFrame(frame);
</script>
