<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>SHADOW DASH — DINOSPEAR V01</title>
<link rel="stylesheet" href="ui.css">
<script src="../assets/js/rotate.js?v=V56" defer></script>
<style>
/* SHADOW DASH V01 — a hard boss-rush story game: run, jump, dash through danger, shoot, and parry the pink shots. 1 player or 2 on one device. Works offline. */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b1020}
.screen{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(circle at 50% 30%,rgba(124,58,237,.35),rgba(5,8,20,.95));padding:16px;overflow:auto}
.screen[hidden],.pad[hidden],#hudD[hidden]{display:none}
.card{background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px;max-width:640px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{margin:4px 0 6px;font-size:clamp(30px,6vw,48px);letter-spacing:1px;background:linear-gradient(90deg,#f472b6,#a78bfa,#38bdf8);-webkit-background-clip:text;color:transparent}
.card p{opacity:.88;line-height:1.7;margin:6px 0}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.bosses button{border-radius:16px;padding:12px;color:#fff;font-weight:900;text-align:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12)}
.bosses button small{display:block;font-weight:600;opacity:.8;margin-top:4px}
.bosses button[disabled]{opacity:.35}
.bosses button.won{border-color:#22c55e}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.big{border-radius:14px;padding:12px 22px;font-weight:900;font-size:16px;background:#a78bfa;color:#140b2e}
.big.sec{background:rgba(255,255,255,.12);color:#fff}
.big.on{background:#22c55e;color:#06210f}
#hudD{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:6;pointer-events:none}
#hudD .chip{pointer-events:auto}
.pad{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;align-items:flex-end}
.pad.r{right:max(14px,env(safe-area-inset-right));flex-wrap:wrap;width:190px;justify-content:flex-end}
.pb{width:78px;height:78px;border-radius:50%;color:#fff;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);touch-action:none}
.pb.j{background:rgba(34,197,94,.88)}.pb.d{background:rgba(56,189,248,.88)}.pb.s{background:rgba(244,114,182,.88)}.pb.x{background:rgba(250,204,21,.9);color:#3b2f00;width:62px;height:62px}
.pb.on{transform:scale(.92);filter:brightness(1.25)}
@media (pointer:fine){.pad{display:none}}
body.playing .lang{display:none}
</style>
</head>

 <button class="chip btn" id="bMenu" type="button">☰</button>

 </div>
