 { ar: 'البشر في القاعدة خايفين منك وعايزين يقضوا عليك. والمفاتيح الماشية — بإيدين ورجلين — بتقطع أي حد نصين. بس انت تقدر تضربها!', en: 'The humans at the base are scared and want to get rid of you. And the walking keys — with arms and legs — cut anyone in half. But you can fight them!', svg: `

  $('scene').innerHTML = s.svg; $('cap').textContent = L() === 'en' ? s.en : s.ar;
  $('scene').classList.remove('flash'); if (s.flash) { void $('scene').getBoundingClientRect(); $('scene').classList.add('flash'); beep(90, 0.6, 'sawtooth', 0.08); } else beep(500, 0.05, 'sine', 0.02);
  $('dots').innerHTML = SCENES.map((x, i) => '<i class="' + (i === sceneI ? 'on' : '') + '"></i>').join('');
  $('sNext').textContent = sceneI === SCENES.length - 1 ? T('Start!', 'يلا نبدأ!') : T('Next', 'التالي');
}
function playStory(then) { afterStory = then; sceneI = 0; $('menu').hidden = true; $('end').hidden = true; $('story').hidden = false; showScene(); }
function endStory() { $('story').hidden = true; const f = afterStory; afterStory = null; f && f(); }

// ---------- Mars world ----------
const W = makeWorld({ sky: 0x2a1108, fog: 0x3b170b, fogNear: 30, fogFar: 95, ambient: 0.55, sun: 1.15 });
const { scene, camera, renderer, sun } = W;
setupJoystick(); bindButton('bAtk', 'KeyF'); bindButton('bHide', 'KeyE'); bindButton('bRun', 'Run');
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
{ // ground with dunes
  const g = new THREE.PlaneGeometry(HALF * 2 + 40, HALF * 2 + 40, 90, 90); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), edge = Math.max(0, Math.max(Math.abs(x), Math.abs(z)) - HALF) * 0.5;
    pos.setY(i, Math.sin(x * 0.08) * Math.cos(z * 0.07) * 0.35 + edge * edge * 0.15);
    const c = new THREE.Color(0xb4532a).lerp(new THREE.Color(0x7c2d12), (Math.sin(x * 0.21 + z * 0.13) + 1) * 0.25); col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true })); m.receiveShadow = true; scene.add(m);
}
{ // stars + two moons
  const sg = new THREE.BufferGeometry(), sp = [];
  for (let i = 0; i < 500; i++) { const a = rnd() * 6.28, b = rnd() * 1.2 + 0.2, r = 150; sp.push(Math.cos(a) * Math.cos(b) * r, Math.sin(b) * r, Math.sin(a) * Math.cos(b) * r); }
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, fog: false })));
  [[60, 70, -120, 6], [-90, 50, -110, 3.5]].forEach(m => { const s = new THREE.Mesh(new THREE.SphereGeometry(m[3], 20, 14), new THREE.MeshBasicMaterial({ color: 0xd6d3d1, fog: false })); s.position.set(m[0], m[1], m[2]); scene.add(s); });
}
const hides = [];
for (let i = 0; i < 90; i++) { // rocks
  const x = (rnd() * 2 - 1) * HALF, z = (rnd() * 2 - 1) * HALF; if (Math.hypot(x, z) < 8 || Math.hypot(x, z + HALF - 8) < 9) continue;
  const s = 0.6 + rnd() * 1.8, rm = model('rock'), r = rm || new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), mat(0x6b2a12, { flatShading: true })); if (rm) rm.scale.setScalar(s * 0.9);
  r.position.set(x, rm ? 0 : s * 0.5, z); r.rotation.set(rm ? 0 : rnd() * 3, rnd() * 3, rm ? 0 : rnd() * 3); r.castShadow = r.receiveShadow = true; scene.add(r);
  walls.push({ x0: x - s * 0.8, x1: x + s * 0.8, z0: z - s * 0.8, z1: z + s * 0.8, tall: s > 1.3 });
}
for (let i = 0; i < 34; i++) { // dark craters to hide in
  const x = (rnd() * 2 - 1) * (HALF - 5), z = (rnd() * 2 - 1) * (HALF - 5); if (Math.hypot(x, z) < 10) continue;
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.45, 8, 18), mat(0x5b210d, { flatShading: true })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.25; g.add(ring);

}

  const dome = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 14, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xe2e8f0, { metalness: 0.3, roughness: 0.3, transparent: true, opacity: 0.85 }));

{
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 9, 18), mat(0xf1f5f9, { metalness: 0.4, roughness: 0.3 })); body.position.y = 5.5;
